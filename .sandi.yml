# sandi holds its own comments to its guidelines. Jev's answers are committed in .sandi-judgments.json, so CI replays
# them and needs no key. After a change to a comment, or to the code it is about, record the new answers with
# `bundle exec exe/sandi --update` and OPENROUTER_API_KEY set, and commit them.
guidelines:
  - WhatComment
  - StaleComment

# `bundle exec exe/sandi --autocorrect` asks these models, in turn, to rewrite the files that break a rule, and keeps a
# rewrite only if the counts fall, no method is lost and the tests pass.
autocorrect:
  test: bundle exec rake test
  model:
    - anthropic/claude-haiku-5.5
    - openai/gpt-6.1-terra
