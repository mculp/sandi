# Sandi Metz's guidelines: what she says about code that a parser can't check, put to Jev, TypeSafe's decision model,
# as yes/no questions. Each is asked about one comment, with the code it is about, as the state
#
#   {"comment": "the comment's text", "code": "the class, module or def it documents, or the method it is in"}
#
# and Jev answers with a noul, the probability that the answer is yes. A yes counts against the comment's file. A
# project turns guidelines on by name in its .sandi.yml.
#
# Each question is phrased so that yes is the finding, and its criteria say where yes ends. Changing a question's
# words changes every answer's key, so the next run asks Jev again. These words were calibrated against Jev on
# labeled examples, as GUIDELINES.md describes, so calibrate again before changing them.

# Practical Object-Oriented Design in Ruby, chapter 2: when a bit of code inside a method needs a comment, extract it
# into a method named for what the comment says, and the name can't drift from the code the way the comment can. So
# this counts only comments inside a method. One above a class, module or method describes it, and is a no.
WhatComment:
  instructions: Is `comment` a note inside a method in `code` that only says what the lines after it do?
  criteria:
    "true": >-
      The comment is a line inside a method in `code`, and it narrates a step or restates what the lines after it do.
      Those lines could be extracted into a method named for what the comment says, and the comment would not be
      needed.
    "false": >-
      The comment is not inside a method in `code`: it sits above a class, module or method and describes it. Or it
      says something the code cannot: why the code is written this way, a constraint, a workaround, a decision, a
      warning or a reference, or what the code means in the problem it solves.

# Practical Object-Oriented Design in Ruby, chapter 2. Comments aren't executed, so they decay as the code changes
# around them, and a comment that disagrees with the code misleads the readers who trust it.
StaleComment:
  instructions: Does `code` contradict something `comment` says about it?
  criteria:
    "true": >-
      The comment states a behavior, value, name, parameter, return value, order or limit that the code does
      differently, so a reader who trusts the comment is misled.
    "false": >-
      Everything the comment says about the code is true of it, or the comment says nothing the code could
      contradict. A method defined outside `code` may well do what the comment says, so a claim about one is not
      contradicted. Ruby's own methods do what Ruby documents.
