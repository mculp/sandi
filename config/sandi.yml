# Sandi Metz's limits, and only those. A project inherits them with
#
#   inherit_gem:
#     sandi: config/sandi.yml
#
# and lists what to measure under AllCops: Include. Code that is not included is not measured.
AllCops:
  DisabledByDefault: true
  NewCops: disable
  SuggestExtensions: false

Metrics/ClassLength:
  Enabled: true
  Max: 100

Metrics/ModuleLength:
  Enabled: true
  Max: 100

Metrics/MethodLength:
  Enabled: true
  Max: 5

Metrics/ParameterLists:
  Enabled: true
  Max: 4
  CountKeywordArgs: true
