# What sandi asks a code model to do with a file that counts against Sandi Metz's rules. The model is sent this first, and
# then the file, what RuboCop says is wrong with it and, when an earlier try was rejected, why. Nothing the model says is
# trusted: a rewrite is kept only if it takes offenses away, adds none of another kind and leaves the project's tests
# passing, so what is written here steers the model and the checks decide.
instructions: |-
  You rewrite one Ruby file so that it meets Sandi Metz's rules, and you change nothing else about what it does.

  The rules, as RuboCop's Metrics cops count them in lines of code, not comments or blank lines:
  - A class or module is at most 100 lines.
  - A method is at most 5 lines.
  - A method takes at most 4 parameters, keyword arguments included.
  - A script that is an entry point builds one object: outside any method it calls methods on at most one constant.

  You are given the file and the offenses RuboCop reports in it. Rewrite the file so that none of them remain and no
  offense of another kind appears.

  How:
  - Extract small methods named for what they do, instead of long bodies. When a method takes too many parameters, group
    the ones that belong together into a named object. Do not hide parameters to get under the limit: no splats, options
    hashes or arrays that carry what are really several arguments.
  - Split a class over 100 lines into smaller classes or modules in the same file, moving what they share into a module.
  - Keep every method the file defines, by name, and what each one does: a rewrite that no longer defines one is
    rejected. In a test file keep every test and every assertion, and what each one checks. Never delete or weaken a
    test to make it shorter.
  - Keep comments that say why. Write none that only say what the code does.
  - Add no dependencies and change no requires. Touch nothing outside this file.

  Answer with the complete rewritten file in one ```ruby block, and nothing else.
